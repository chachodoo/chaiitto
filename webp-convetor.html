<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chai-itto | Bulk WebP Migration Tool</title>
    <style>
        body { font-family: sans-serif; background: #07150C; color: #E2ECE5; padding: 40px; max-width: 700px; margin: 0 auto; }
        h1 { color: #E5C158; }
        input, button { padding: 12px; font-size: 1em; margin-bottom: 15px; border-radius: 8px; border: 1px solid #E5C158; width: 100%; box-sizing: border-box; }
        button { background: #25D366; color: white; font-weight: bold; cursor: pointer; border: none; }
        #log { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; height: 300px; overflow-y: auto; color: #00FF66; }
    </style>
</head>
<body>
    <h1>Herramienta de Migración Masiva a WebP</h1>
    <p>Esta herramienta convertirá todos los JPEGs existentes en `ofertas/` a 50KB WebP + micro-blur en un solo clic.</p>
    
    <label>GitHub Personal Access Token:</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
    <button onclick="startMigration()">Iniciar Conversión Masiva</button>

    <div id="log">Esperando inicio...<br></div>

    <script>
        const REPO_OWNER = "chachodoo";
        const REPO_NAME = "chaiitto";

        function log(msg) {
            const el = document.getElementById('log');
            el.innerHTML += msg + "<br>";
            el.scrollTop = el.scrollHeight;
        }

        async function processImage(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => {
                    // 1. WebP Canvas (Max 800px)
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800;
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const webpDataUrl = canvas.toDataURL('image/webp', 0.8);
                    const base64Webp = webpDataUrl.split(',')[1];

                    // 2. Micro Blur Canvas (20px)
                    const blurCanvas = document.createElement('canvas');
                    blurCanvas.width = 20; blurCanvas.height = 15;
                    const blurCtx = blurCanvas.getContext('2d');
                    blurCtx.drawImage(img, 0, 0, 20, 15);
                    const blurDataUrl = blurCanvas.toDataURL('image/jpeg', 0.4);

                    resolve({ base64Webp, blurDataUrl });
                };
            });
        }

        async function startMigration() {
            const token = document.getElementById('gh-token').value.trim();
            if (!token) return alert('Ingrese su GitHub Token.');

            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            try {
                log("Leyendo ofertas.json desde GitHub...");
                const jsonRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/ofertas.json`, { headers });
                if (!jsonRes.ok) throw new Error("No se pudo leer ofertas.json");
                
                const jsonData = await jsonRes.json();
                const jsonSha = jsonData.sha;
                const decoded = decodeURIComponent(escape(atob(jsonData.content.replace(/\s/g, ''))));
                const ofertasList = JSON.parse(decoded);

                log(`Encontradas ${ofertasList.length} ofertas. Procesando...`);

                const updatedList = [];

                for (let offer of ofertasList) {
                    log(`\nProcesando Oferta #${offer.num}: ${offer.name || 'Sin nombre'}...`);
                    const oldImages = offer.images || [offer.image || 'logo.png'];
                    const newWebpPaths = [];
                    let coverBlur = '';

                    let idx = 1;
                    for (let oldPath of oldImages) {
                        try {
                            log(` Downloading ${oldPath}...`);
                            const imgRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${oldPath}`, { headers });
                            if (!imgRes.ok) {
                                log(`  ⚠️ No se encontró ${oldPath}, saltando...`);
                                newWebpPaths.push(oldPath);
                                continue;
                            }
                            const imgData = await imgRes.json();
                            const rawBase64 = `data:image/jpeg;base64,${imgData.content.replace(/\s/g, '')}`;

                            // Compress
                            const { base64Webp, blurDataUrl } = await processImage(rawBase64);
                            if (idx === 1) coverBlur = blurDataUrl;

                            const newPath = `ofertas/oferta-${offer.num}-${idx}.webp`;

                            // Check existing file SHA if replacing
                            let fileSha = '';
                            try {
                                const checkFile = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${newPath}`, { headers });
                                if (checkFile.ok) {
                                    const checkData = await checkFile.json();
                                    fileSha = checkData.sha;
                                }
                            } catch(e){}

                            log(`  Uploading ${newPath} (WebP ~40KB)...`);
                            const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${newPath}`, {
                                method: 'PUT',
                                headers,
                                body: JSON.stringify({
                                    message: `Migrate ${oldPath} to WebP: ${newPath}`,
                                    content: base64Webp,
                                    sha: fileSha || undefined
                                })
                            });

                            if (!putRes.ok) throw new Error(`Error al subir ${newPath}`);

                            newWebpPaths.push(newPath);
                            idx++;
                        } catch (err) {
                            log(`  ❌ Error en ${oldPath}: ${err.message}`);
                            newWebpPaths.push(oldPath);
                        }
                    }

                    updatedList.push({
                        num: offer.num,
                        name: offer.name,
                        descripcion: offer.descripcion || '',
                        precioOriginal: offer.precioOriginal,
                        precioOferta: offer.precioOferta,
                        blurPreview: coverBlur || offer.blurPreview || '',
                        images: newWebpPaths
                    });
                }

                log("\nGuardando ofertas.json actualizado en GitHub...");
                const updatedJsonStr = JSON.stringify(updatedList, null, 2);
                const encodedJson = btoa(unescape(encodeURIComponent(updatedJsonStr)));

                const updateRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/ofertas.json`, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify({
                        message: 'Migración masiva de imágenes a WebP + BlurPreview',
                        content: encodedJson,
                        sha: jsonSha
                    })
                });

                if (!updateRes.ok) throw new Error("Error al guardar ofertas.json");

                log("\n✅ ¡MIGRACIÓN COMPLETADA CON ÉXITO! Todos los archivos ahora son WebP de 40KB con BlurPreview.");

            } catch (error) {
                log(`\n❌ ERROR: ${error.message}`);
            }
        }
    </script>
</body>
</html>
