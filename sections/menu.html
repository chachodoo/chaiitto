<div class="story-card">
    <h1 class="story-title"><i class="fa-solid fa-book-open"></i> Menú Sucursal Cholula</h1>
    <div class="story-subtitle">Explora nuestra carta completa de tés, café orgánico, bebidas y repostería artesanal</div>

    <!-- Interactive Menu Viewer -->
    <div class="menu-viewer-container" style="background: rgba(0,0,0,0.3); border: 1px solid var(--gold-accent); border-radius: 12px; padding: 15px; text-align: center;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--gold-accent); font-weight: bold;">
            <button onclick="changeMenuPage(-1)" class="nav-btn" style="padding: 6px 14px; border: 1px solid var(--gold-accent); border-radius: 20px;"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
            <span id="menu-page-indicator" style="font-family: var(--font-heading); font-size: 1.1em;">Página 1 de 13</span>
            <button onclick="changeMenuPage(1)" class="nav-btn" style="padding: 6px 14px; border: 1px solid var(--gold-accent); border-radius: 20px;">Siguiente <i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- Main Image Display with Instant Loader -->
        <div style="position: relative; min-height: 400px; display: flex; align-items: center; justify-content: center; background: #111; border-radius: 8px; overflow: hidden; border: 1px solid rgba(229, 193, 88, 0.2);">
            <div id="menu-loader" style="display: none; position: absolute; color: var(--gold-accent); font-size: 1.5em; z-index: 2;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            </div>
            <img id="menu-current-image" 
                 src="menu/page-1.webp" 
                 alt="Página del Menú Chai-Itto" 
                 decoding="async" 
                 style="max-width: 100%; height: auto; border-radius: 4px; transition: opacity 0.15s ease;"
                 onload="handleMenuImageLoaded()"
                 onerror="handleMenuImageError()">
        </div>
    </div>
</div>
