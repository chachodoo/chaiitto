<style>
  /* ==========================================
     FULL-WIDTH CATALOG GRID (NO SIDEBAR)
     ========================================== */
  #accesorios-dynamic-track {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) !important; /* 6 per row on desktop */
    gap: 14px !important;
    width: 100% !important;
    margin-top: 20px;
  }

  /* Intermediate screen scaling */
  @media (max-width: 1280px) {
    #accesorios-dynamic-track {
      grid-template-columns: repeat(4, 1fr) !important; /* 4 per row on small laptops */
    }
  }

  @media (max-width: 900px) {
    #accesorios-dynamic-track {
      grid-template-columns: repeat(3, 1fr) !important; /* 3 per row on tablets */
    }
  }

  /* Mobile: 2 per row */
  @media (max-width: 600px) {
    #accesorios-dynamic-track {
      grid-template-columns: repeat(2, 1fr) !important; /* 2 per row on phones */
      gap: 10px !important;
    }
    #accesorios-dynamic-track .product-card {
      padding: 10px 8px !important;
    }
    #accesorios-dynamic-track .product-img-box {
      height: 110px !important;
    }
    #accesorios-dynamic-track .product-name {
      font-size: 0.88rem !important;
    }
  }

  /* ==========================================
     OFERTA BADGE & PRICING STYLES
     ========================================== */
  .badge-oferta {
    position: absolute;
    top: 8px;
    right: 8px;
    background: linear-gradient(135deg, #FF1E27 0%, #D60000 100%);
    color: #FFFFFF;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    z-index: 2;
  }

  .precio-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 6px 0;
  }

  .precio-original {
    text-decoration: line-through;
    color: #888888;
    font-size: 0.82rem;
  }

  .precio-actual {
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--matcha-deep, #2D5A27);
  }
</style>



<div class="story-card">
    <!-- RESPONSIVE ACCESORIOS GRID CONTAINER -->
    <div class="catalog-grid" id="accesorios-dynamic-track">
        <!-- Dynamic accessory cards injected from accesorios.json -->
    </div>
</div>

<!-- LIGHTBOX ZOOM MODAL -->
<div id="oferta-modal" class="oferta-modal" onclick="closeOfertaModalOnBackdrop(event)">
    <div class="oferta-modal-content">
        <span class="oferta-modal-close" onclick="closeOfertaModal()">&times;</span>
        
        <h3 id="modal-title" class="oferta-title" style="font-size: 1.3em; margin: 5px 0;"></h3>
        <p id="modal-subtitle" class="oferta-subtitle" style="margin-bottom: 5px;"></p>

        <div class="oferta-modal-viewer">
            <button id="modal-prev-btn" class="modal-arrow prev" onclick="changeModalImage(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <img id="modal-img" src="logo.png" alt="Zoom Accesorio" decoding="async">
            
            <button id="modal-next-btn" class="modal-arrow next" onclick="changeModalImage(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div id="modal-counter" style="color: #A3C4AF; font-size: 0.85em; margin-bottom: 12px;"></div>

        <a id="modal-buy-btn" href="#" target="_blank" rel="noopener noreferrer" class="oferta-buy-btn" style="width: 100%; max-width: 300px; padding: 12px;">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Comprar Accesorio
        </a>
    </div>
</div>

<div class="shipping-box" style="background: rgba(74, 124, 54, 0.05); border: 1px solid rgba(74, 124, 54, 0.2); border-radius: 12px; padding: 15px 20px; margin-top: 30px; margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; text-align: center; font-size: 0.9em; line-height: 1.5;">
    <i class="fa-solid fa-truck-fast fa-2x" style="color: var(--matcha-deep); margin-bottom: 10px;"></i>
    <p style="margin: 0; color: var(--text-dark);"><strong>Política de Envíos Chai-itto:</strong> Las degustaciones en <em>taza</em> son exclusivas para nuestra sucursal física en Cholula. Para envíos a todo México, comercializamos nuestros <em>frascos</em> y <em>sobres</em>. Tu pedido se envía inmediatamente tras confirmar tu pago y llega de 3 a 5 días hábiles.</p>
</div>
