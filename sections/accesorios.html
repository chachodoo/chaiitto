<div class="story-card">
    <h1 class="story-title"><i class="fa-solid fa-boxes-packing" style="color: var(--gold-accent);"></i> Accesorios</h1>
    <div class="story-subtitle">Utensilios y Accesorios de Preparación</div>

    <!-- HIGH-CONTRAST HELPER BANNER -->
    <div class="ofertas-notice-banner">
        <i class="fa-solid fa-magnifying-glass-plus pulse-icon"></i>
        <span><strong>¡Haz clic o toca cualquier imagen!</strong> para verla en grande y explorar todas sus fotos.</span>
    </div>

    <!-- RESPONSIVE ACCESORIOS GRID CONTAINER -->
    <div class="catalog-grid" id="accesorios-dynamic-track">
        <!-- Dynamic accessory cards injected from accesorios.json -->
    </div>
</div>

<!-- LIGHTBOX ZOOM MODAL -->
<div id="oferta-modal" class="oferta-modal" onclick="closeOfertaModalOnBackdrop(event)">
    <div class="oferta-modal-content">
        <span class="oferta-modal-close" onclick="closeOfertaModal()">&times;</span>
        
        <h3 id="modal-title" class="oferta-title" style="font-size: 1.3em; margin: 5px 0;"></h3>
        <p id="modal-subtitle" class="oferta-subtitle" style="margin-bottom: 5px;"></p>

        <div class="oferta-modal-viewer">
            <button id="modal-prev-btn" class="modal-arrow prev" onclick="changeModalImage(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <img id="modal-img" src="logo.png" alt="Zoom Accesorio" decoding="async">
            
            <button id="modal-next-btn" class="modal-arrow next" onclick="changeModalImage(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div id="modal-counter" style="color: #A3C4AF; font-size: 0.85em; margin-bottom: 12px;"></div>

        <a id="modal-buy-btn" href="#" target="_blank" rel="noopener noreferrer" class="oferta-buy-btn" style="width: 100%; max-width: 300px; padding: 12px;">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Comprar Accesorio
        </a>
    </div>
</div>
