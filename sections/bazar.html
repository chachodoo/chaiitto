<style>
  /* Tightened, compact gate card */
  .vip-login-card {
    max-width: 360px;
    margin: 20px auto;
    padding: 24px 20px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    border: 1px solid #E2ECE5;
    text-align: center;
    font-family: var(--font-body, 'Montserrat', sans-serif);
  }
  .vip-gate-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: rgba(7, 81, 26, 0.08);
    color: var(--matcha-deep, #07511A);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
  }
  .vip-login-card h3 {
    margin: 0 0 16px;
    font-size: 1.2rem;
    line-height: 1.25;
    color: var(--matcha-deep, #102619);
    font-family: var(--font-heading, inherit);
    font-weight: 800;
  }
  .vip-form .input-wrapper {
    position: relative;
    margin-bottom: 12px;
  }
  .vip-form .input-wrapper i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 0.9rem;
  }
  .vip-form input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px 10px 36px;
    border: 1px solid #E2ECE5;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    background: #f8fafc;
    color: #1e293b;
  }
  .vip-form input:focus {
    border-color: var(--matcha-deep, #07511A);
    background: #ffffff;
  }
  .btn-unlock {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--matcha-deep, #07511A);
    color: #ffffff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(7, 81, 26, 0.25);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-unlock:hover {
    background: #0e3d16;
    transform: translateY(-1px);
  }
</style>

<!-- LOCKED STATE: PIN GATE -->
<div id="bazar-vip-lock" class="vip-login-card">
  <div class="vip-gate-icon">
    <i class="fa-solid fa-shield-halved"></i>
  </div>
  <h3>Acceso para Socios VIP</h3>

  <form class="vip-form" onsubmit="return false;">
    <!-- PHONE WITH COUNTRY SELECTOR -->
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <select id="bazar-country-select" style="width: 95px; box-sizing: border-box; padding: 10px 6px; border: 1px solid #E2ECE5; border-radius: 8px; font-size: 0.88rem; background: #ffffff; color: var(--matcha-deep, #102619); font-weight: 700; cursor: pointer;">
        <option value="52" selected>🇲🇽 +52</option>
        <option value="1">🇺🇸 +1</option>
      </select>
      <div class="input-wrapper" style="flex: 1; min-width: 0; margin-bottom: 0;">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" id="vip-phone-input" placeholder="10 dígitos WhatsApp" pattern="[0-9]{10}" maxlength="10" onkeydown="if (event.key === 'Enter') verifyVipPin();">
      </div>
    </div>

    <!-- PIN INPUT -->
    <div class="input-wrapper" style="margin-bottom: 8px;">
      <i class="fa-solid fa-key"></i>
      <input type="password" id="vip-pin-input" placeholder="PIN VIP" onkeydown="if (event.key === 'Enter') verifyVipPin();">
    </div>

    <div id="vip-pin-error" style="color: #D9534F; font-size: 0.82rem; font-weight: 700; min-height: 18px; margin-bottom: 10px;"></div>

    <button type="button" class="btn-unlock" onclick="verifyVipPin()">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> ENTRAR
    </button>
  </form>
</div>

<!-- UNLOCKED STATE: VIP SHOWCASE -->
<div id="bazar-vip-content" class="story-card">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px;">
    <h1 class="story-title" style="margin: 0; text-align: left;"><i class="fa-solid fa-crown" style="color: var(--gold-accent);"></i> Bazar VIP</h1>
  </div>
  <div class="story-subtitle" style="text-align: left;">Selección Exclusiva • Artículos Selectos de Edición Limitada</div>

  <div class="catalog-grid" id="bazar-dynamic-track"></div>
</div>

<!-- LIGHTBOX MODAL -->
<div id="bazar-modal" class="oferta-modal" onclick="closeBazarModalOnBackdrop(event)">
  <div class="oferta-modal-content">
    <span class="oferta-modal-close" onclick="closeBazarModal()">&times;</span>
    <h3 id="bazar-modal-title" class="oferta-title" style="font-size: 1.3em; margin: 5px 0;"></h3>
    <p id="bazar-modal-subtitle" class="oferta-subtitle" style="margin-bottom: 5px;"></p>
    
    <div class="oferta-modal-viewer">
      <button id="bazar-modal-prev-btn" class="modal-arrow prev" onclick="changeBazarModalImage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <img id="bazar-modal-img" src="logo.png" alt="Zoom Bazar" decoding="async">
      <button id="bazar-modal-next-btn" class="modal-arrow next" onclick="changeBazarModalImage(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    
    <div id="bazar-modal-counter" style="color: #A3C4AF; font-size: 0.85em; margin-bottom: 12px;"></div>
    <a id="bazar-modal-buy-btn" href="#" target="_blank" rel="noopener noreferrer" class="oferta-buy-btn" style="width: 100%; max-width: 300px; padding: 12px;">
      <i class="fa-brands fa-whatsapp fa-lg"></i> Comprar en Bazar
    </a>
  </div>
</div>
