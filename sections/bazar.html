<style>
  /* Lock Gate Box VIP */
.vip-login-card {
    max-width: 400px;
    margin: 40px auto;
    padding: 40px 30px;
    background: #ffffff;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    text-align: center;
    font-family: var(--font-body, 'Montserrat', sans-serif);
}

.vip-header { margin-bottom: 25px; }

.vip-crown-icon {
    color: var(--gold-accent, #D4AF37);
    font-size: 2.2rem;
    margin-bottom: 15px;
}

.vip-header h3 {
    font-family: var(--font-heading, 'Cinzel', serif);
    color: var(--matcha-deep, #102619);
    font-size: 1.5rem;
    font-weight: 700;
}

.vip-header p {
    color: #666;
    font-size: 0.9rem;
    margin: 0;
}

.input-wrapper {
    position: relative;
    margin-bottom: 15px;
}

.input-wrapper i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--matcha-deep, #102619);
    opacity: 0.5;
}

.vip-form input {
    width: 100%;
    padding: 14px 14px 14px 45px;
    border: 1px solid #E2ECE5;
    border-radius: 8px;
    font-size: 1rem;
    color: var(--matcha-deep, #102619);
    font-family: inherit;
    font-weight: 600;
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.vip-form input:focus {
    outline: none;
    border-color: var(--gold-accent, #D4AF37);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.btn-unlock {
    width: 100%;
    padding: 15px;
    background: var(--matcha-deep, #102619);
    color: #F5D061;
    border: none;
    border-radius: 8px;
    font-family: var(--font-heading, 'Cinzel', serif);
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.btn-unlock:hover {
    background: #1A4E21;
    transform: translateY(-2px);
}

.vip-join-link {
    display: inline-block;
    margin-top: 25px;
    color: var(--matcha-deep, #102619);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.2s;
}

.vip-join-link strong {
    color: var(--gold-accent, #D4AF37);
    font-weight: 600;
}

.vip-join-link:hover strong {
    text-decoration: underline;
}

  /* Catalog Grid (hidden until PIN is verified) */
  #bazar-vip-content {
    display: none;
  }

  #bazar-dynamic-track {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) !important;
    gap: 14px !important;
    width: 100% !important;
    margin-top: 20px;
  }

  @media (max-width: 1280px) {
    #bazar-dynamic-track { grid-template-columns: repeat(4, 1fr) !important; }
  }
  @media (max-width: 900px) {
    #bazar-dynamic-track { grid-template-columns: repeat(3, 1fr) !important; }
  }
  @media (max-width: 600px) {
    #bazar-dynamic-track { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
    #bazar-dynamic-track .product-card { padding: 10px 8px !important; }
    #bazar-dynamic-track .product-img-box { height: 110px !important; }
    #bazar-dynamic-track .product-name { font-size: 0.88rem !important; }
  }

  .badge-oferta {
    position: absolute;
    top: 8px;
    right: 8px;
    background: linear-gradient(135deg, #FF1E27 0%, #D60000 100%);
    color: #FFFFFF;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(255, 30, 39, 0.45);
    z-index: 2;
  }
</style>

<!-- LOCKED STATE: PIN GATE -->
<div id="bazar-vip-lock" class="vip-login-card">
    <div class="vip-header">
        <i class="fa-solid fa-crown vip-crown-icon"></i>
        <h3 style="margin-bottom: 5px;">Acceso VIP Premium</h3>
        <p>Exclusivo para miembros. Ingresa tu clave.</p>
    </div>

    <form class="vip-form" onsubmit="return false;">
        <div class="input-wrapper">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="vip-phone-input" placeholder="Número de WhatsApp" onkeydown="if (event.key === 'Enter') verifyVipPin();">
        </div>
        <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="vip-pin-input" placeholder="PIN VIP" onkeydown="if (event.key === 'Enter') verifyVipPin();">
        </div>

        <div id="vip-pin-error" style="color: #D9534F; font-size: 0.85rem; font-weight: 700; min-height: 20px; margin-bottom: 12px;"></div>

        <button type="button" class="btn-unlock" onclick="verifyVipPin()">
            <i class="fa-solid fa-unlock-keyhole"></i> DESBLOQUEAR
        </button>
    </form>

    <a href="#vip" onclick="window.location.hash='vip';" class="vip-join-link">
        ¿Aún no eres miembro? <strong>Adquiere tu Membresía aquí</strong>
    </a>
</div>

<!-- UNLOCKED STATE: VIP SHOWCASE -->
<div id="bazar-vip-content" class="story-card">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px;">
    <h1 class="story-title" style="margin: 0; text-align: left;"><i class="fa-solid fa-crown" style="color: var(--gold-accent);"></i> Bazar VIP</h1>
    <button onclick="lockBazarVIP()" style="background: transparent; border: 1px solid #AAA; color: #666; border-radius: 15px; padding: 5px 12px; font-size: 0.75rem; cursor: pointer;">
      <i class="fa-solid fa-lock"></i> Cerrar sesión VIP
    </button>
  </div>
  <div class="story-subtitle" style="text-align: left;">Selección Exclusiva • Artículos Selectos de Edición Limitada</div>

  <div class="catalog-grid" id="bazar-dynamic-track"></div>
</div>

<!-- LIGHTBOX MODAL -->
<div id="bazar-modal" class="oferta-modal" onclick="closeBazarModalOnBackdrop(event)">
  <div class="oferta-modal-content">
    <span class="oferta-modal-close" onclick="closeBazarModal()">&times;</span>
    <h3 id="bazar-modal-title" class="oferta-title" style="font-size: 1.3em; margin: 5px 0;"></h3>
    <p id="bazar-modal-subtitle" class="oferta-subtitle" style="margin-bottom: 5px;"></p>
    
    <div class="oferta-modal-viewer">
      <button id="bazar-modal-prev-btn" class="modal-arrow prev" onclick="changeBazarModalImage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <img id="bazar-modal-img" src="logo.png" alt="Zoom Bazar" decoding="async">
      <button id="bazar-modal-next-btn" class="modal-arrow next" onclick="changeBazarModalImage(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    
    <div id="bazar-modal-counter" style="color: #A3C4AF; font-size: 0.85em; margin-bottom: 12px;"></div>
    <a id="bazar-modal-buy-btn" href="#" target="_blank" rel="noopener noreferrer" class="oferta-buy-btn" style="width: 100%; max-width: 300px; padding: 12px;">
      <i class="fa-brands fa-whatsapp fa-lg"></i> Comprar en Bazar
    </a>
  </div>
</div>
