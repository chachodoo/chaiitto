<style>
  /* Lock Gate Box */
  .vip-gate-wrapper {
    max-width: 480px;
    margin: 40px auto;
    background: #FFFFFF;
    border: 2px solid var(--gold-border, #D4AF37);
    border-radius: 20px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(45, 90, 39, 0.1);
  }

  .vip-icon-shield {
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, #F5D061 0%, #D4AF37 100%);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    color: #1C3317;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
  }

  .vip-pin-input {
    letter-spacing: 6px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    width: 220px;
    padding: 10px;
    border: 2px solid var(--gold-border, #D4AF37);
    border-radius: 12px;
    background: #FAFDF9;
    color: var(--matcha-deep, #2D5A27);
    margin: 15px auto;
    display: block;
    outline: none;
  }

  .vip-pin-input:focus {
    border-color: var(--matcha-deep, #2D5A27);
    box-shadow: 0 0 10px rgba(45, 90, 39, 0.2);
  }

  /* Catalog Grid (hidden until PIN is verified) */
  #bazar-vip-content {
    display: none;
  }

  #bazar-dynamic-track {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) !important;
    gap: 14px !important;
    width: 100% !important;
    margin-top: 20px;
  }

  @media (max-width: 1280px) {
    #bazar-dynamic-track { grid-template-columns: repeat(4, 1fr) !important; }
  }
  @media (max-width: 900px) {
    #bazar-dynamic-track { grid-template-columns: repeat(3, 1fr) !important; }
  }
  @media (max-width: 600px) {
    #bazar-dynamic-track { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
    #bazar-dynamic-track .product-card { padding: 10px 8px !important; }
    #bazar-dynamic-track .product-img-box { height: 110px !important; }
    #bazar-dynamic-track .product-name { font-size: 0.88rem !important; }
  }

  .badge-oferta {
    position: absolute;
    top: 8px;
    right: 8px;
    background: linear-gradient(135deg, #FF1E27 0%, #D60000 100%);
    color: #FFFFFF;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(255, 30, 39, 0.45);
    z-index: 2;
  }
</style>

<!-- LOCKED STATE: PIN GATE -->
<div id="bazar-vip-lock" class="vip-gate-wrapper">
  <div class="vip-icon-shield">
    <i class="fa-solid fa-crown"></i>
  </div>
  <h2 style="font-family: var(--font-heading); color: var(--matcha-deep, #2D5A27); margin: 0 0 8px 0;">BAZAR VIP</h2>
  <p style="color: var(--text-muted, #666); font-size: 0.9rem; margin-bottom: 20px;">
    Acceso exclusivo para miembros VIP Premium. Ingresa tu clave.
  </p>
  <input type="tel" id="vip-phone-input" placeholder="WhatsApp" style="width: 220px; padding: 11px 14px; border: 2px solid var(--gold-border, #D4AF37); border-radius: 12px; background: #FAFDF9; color: var(--matcha-deep, #2D5A27); margin: 0 auto 10px auto; display: block; outline: none; text-align: center; font-size: 1rem; font-weight: 600; box-sizing: border-box;" onkeydown="if (event.key === 'Enter') verifyVipPin();">
<input type="password" id="vip-pin-input" placeholder="PIN VIP" style="width: 220px; padding: 11px 14px; border: 2px solid var(--gold-border, #D4AF37); border-radius: 12px; background: #FAFDF9; color: var(--matcha-deep, #2D5A27); margin: 0 auto 14px auto; display: block; outline: none; text-align: center; font-size: 1rem; font-weight: 600; box-sizing: border-box;" onkeydown="if (event.key === 'Enter') verifyVipPin();">
<div id="vip-pin-error" style="color: #D9534F; font-size: 0.85rem; font-weight: 700; min-height: 20px; margin-bottom: 12px;"></div>
<button onclick="verifyVipPin()" class="nav-btn" style="width: 100%; max-width: 220px; margin: 0 auto 15px auto; padding: 12px; background: var(--matcha-deep, #2D5A27); color: #FFF; font-weight: bold; border-radius: 10px; cursor: pointer;">
    <i class="fa-solid fa-lock-open"></i> Desbloquear
</button>

    <div>
      <button type="button" onclick="window.location.hash='vip';" 
              style="background: transparent; border: none; font-size: 0.86rem; color: var(--gold-accent, #AA7C11); font-weight: 700; cursor: pointer; text-decoration: underline; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <i class="fa-solid fa-crown"></i> ¿Aún no eres miembro? Adquiere tu Membresía VIP Premium aquí
      </button>
    </div>
</div>

<!-- UNLOCKED STATE: VIP SHOWCASE -->
<div id="bazar-vip-content" class="story-card">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px;">
    <h1 class="story-title" style="margin: 0; text-align: left;"><i class="fa-solid fa-crown" style="color: var(--gold-accent);"></i> Bazar VIP</h1>
    <button onclick="lockBazarVIP()" style="background: transparent; border: 1px solid #AAA; color: #666; border-radius: 15px; padding: 5px 12px; font-size: 0.75rem; cursor: pointer;">
      <i class="fa-solid fa-lock"></i> Cerrar sesión VIP
    </button>
  </div>
  <div class="story-subtitle" style="text-align: left;">Selección Exclusiva • Artículos Selectos de Edición Limitada</div>

  <div class="catalog-grid" id="bazar-dynamic-track"></div>
</div>

<!-- LIGHTBOX MODAL -->
<div id="bazar-modal" class="oferta-modal" onclick="closeBazarModalOnBackdrop(event)">
  <div class="oferta-modal-content">
    <span class="oferta-modal-close" onclick="closeBazarModal()">&times;</span>
    <h3 id="bazar-modal-title" class="oferta-title" style="font-size: 1.3em; margin: 5px 0;"></h3>
    <p id="bazar-modal-subtitle" class="oferta-subtitle" style="margin-bottom: 5px;"></p>
    
    <div class="oferta-modal-viewer">
      <button id="bazar-modal-prev-btn" class="modal-arrow prev" onclick="changeBazarModalImage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <img id="bazar-modal-img" src="logo.png" alt="Zoom Bazar" decoding="async">
      <button id="bazar-modal-next-btn" class="modal-arrow next" onclick="changeBazarModalImage(1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    
    <div id="bazar-modal-counter" style="color: #A3C4AF; font-size: 0.85em; margin-bottom: 12px;"></div>
    <a id="bazar-modal-buy-btn" href="#" target="_blank" rel="noopener noreferrer" class="oferta-buy-btn" style="width: 100%; max-width: 300px; padding: 12px;">
      <i class="fa-brands fa-whatsapp fa-lg"></i> Comprar en Bazar
    </a>
  </div>
</div>
