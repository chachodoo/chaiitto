<div class="story-card">
    <h1 class="story-title"><i class="fa-solid fa-camera-retro" style="color: var(--gold-accent);"></i> Galería Chai-itto</h1>
    <div class="story-subtitle">Momentos, Té y Tradición</div>

    <!-- 1. ENTERPRISE SWIPEABLE ROW WITH CIRCULAR ARROWS -->
    <div class="gallery-enterprise-wrapper" style="position: relative; width: 100%; margin-top: 20px;">
        
        <style>
            .enterprise-scroll-row {
                display: flex;
                gap: 5px; 
                overflow-x: auto;
                padding-bottom: 15px; 
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch; 
                scrollbar-width: thin; 
                scrollbar-color: #A3C4AF #f0f0f0;
            }
            
            .enterprise-scroll-row::-webkit-scrollbar { height: 8px; }
            .enterprise-scroll-row::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 10px; }
            .enterprise-scroll-row::-webkit-scrollbar-thumb { background-color: #A3C4AF; border-radius: 10px; }

            .gallery-item-card {
                flex: 0 0 auto; 
                width: 180px; 
                height: 180px; 
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 6px rgba(0,0,0,0.1);
                scroll-snap-align: start; 
                background: #F4F7F5;
            }
            
            .gallery-item-card img, .gallery-item-card video {
                width: 100%;
                height: 100%;
                /* CHANGED TO COVER: Fills the entire box so there are no white edges! */
                object-fit: cover; 
                display: block;
            }

            .gallery-nav-btn {
                position: absolute;
                top: 45%;
                transform: translateY(-50%);
                background: rgba(255, 255, 255, 0.95);
                color: var(--matcha-deep);
                border: 1px solid var(--gold-border);
                border-radius: 50%;
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 10;
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
                transition: all 0.2s ease;
            }
            .gallery-nav-btn:hover {
                background: var(--matcha-deep);
                color: #fff;
            }
            .gallery-nav-left { left: -10px; }
            .gallery-nav-right { right: -10px; }
        </style>

        <!-- SMART CIRCULAR NAVIGATION LOGIC -->
        <script>
            function scrollGallery(direction) {
                const container = document.getElementById('gallery-dynamic-container');
                if (!container) return;
                
                const scrollAmount = 300;
                const maxScroll = container.scrollWidth - container.clientWidth;

                if (direction === 'right') {
                    // If at the end, loop back to the 1st image
                    if (container.scrollLeft >= maxScroll - 10) {
                        container.scrollTo({ left: 0, behavior: 'smooth' });
                    } else {
                        container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                } else if (direction === 'left') {
                    // If at the 1st image, loop to the end
                    if (container.scrollLeft <= 10) {
                        container.scrollTo({ left: maxScroll, behavior: 'smooth' });
                    } else {
                        container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    }
                }
            }
        </script>
        
        <button class="gallery-nav-btn gallery-nav-left" onclick="scrollGallery('left')">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div id="gallery-dynamic-container" class="enterprise-scroll-row">
            <!-- Dynamic gallery cards injected safely by JavaScript -->
        </div>

        <button class="gallery-nav-btn gallery-nav-right" onclick="scrollGallery('right')">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <!-- 2. EXACT YOUTUBE PLAYLIST EMBED -->
    <div class="youtube-gallery-section" style="margin-top: 15px; margin-bottom: 20px;">
        <h3 style="color: var(--matcha-deep); font-family: var(--font-title); margin: 10px 0 15px 0; text-align: center;">Videos y Experiencias</h3>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; border-radius: 16px; border: 2px solid var(--gold-border); box-shadow: 0 6px 18px rgba(0,0,0,0.1);">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PL8F14rO99by_JkM37mGinv9CrfOjnBvfB" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0;" allowfullscreen></iframe>
        </div>
    </div>
</div>
