<div class="story-card">
    <h1 class="story-title"><i class="fa-solid fa-camera-retro" style="color: var(--gold-accent);"></i> Galería Chai-itto</h1>
    <div class="story-subtitle">Momentos, Té y Tradición</div>

    <!-- 1. ENTERPRISE SWIPEABLE ROW -->
    <div class="gallery-enterprise-wrapper" style="width: 100%; margin-top: 20px;">
        
        <style>
            /* NATIVE HORIZONTAL SCROLLING WITH SNAP */
            .enterprise-scroll-row {
                display: flex;
                gap: 15px;
                overflow-x: auto;
                padding-bottom: 15px; /* Adds space so the scrollbar doesn't cover images */
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch; /* Butter-smooth swiping on iPhones */
                
                /* Firefox scrollbar styling */
                scrollbar-width: thin; 
                scrollbar-color: #A3C4AF #f0f0f0;
            }
            
            /* Chrome/Safari scrollbar styling */
            .enterprise-scroll-row::-webkit-scrollbar {
                height: 8px;
            }
            .enterprise-scroll-row::-webkit-scrollbar-track {
                background: #f0f0f0;
                border-radius: 10px;
            }
            .enterprise-scroll-row::-webkit-scrollbar-thumb {
                background-color: #A3C4AF; /* Your Matcha Light color */
                border-radius: 10px;
            }

            .gallery-item-card {
                flex: 0 0 auto; /* Prevents cards from squishing together */
                width: 250px;
                height: 250px;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                scroll-snap-align: start; /* Snaps perfectly to the left edge! */
                background: #F4F7F5;
            }
            
            .gallery-item-card img, .gallery-item-card video {
                width: 100%;
                height: 100%;
                object-fit: contain; 
                display: block;
            }
        </style>
        
        <div id="gallery-dynamic-container" class="enterprise-scroll-row">
            <!-- Dynamic gallery cards injected safely by JavaScript -->
        </div>
    </div>
