<style>
  /* =========================================
     1. DESKTOP (992px and up): 10% / 90% (5 JARS)
     ========================================= */
  @media (min-width: 992px) {
    .dashboard-layout {
      display: grid !important;
      grid-template-columns: 10% 90% !important;
      column-gap: 14px !important;
      align-items: start !important;
      width: 100% !important;
      margin: 0 !important;
    }

    .sidebar-menu {
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      flex: none !important;
    }

    .collections-title {
      color: var(--matcha-deep, #2d5a27);
      font-size: 0.8rem !important;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 10px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--gold-accent, #c5a059);
    }

    .collections-pills-track {
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
      width: 100% !important;
    }

    .collections-pills-track .tab-btn {
      width: 100% !important;
      padding: 8px 4px !important;
      font-size: 0.76rem !important;
      font-weight: 700 !important;
      line-height: 1.2 !important;
      white-space: normal !important;
      text-align: center !important;
      justify-content: center !important;
    }

    .collections-pills-track .tab-btn i.fa-chevron-right {
      display: none !important;
    }

    .mobile-scroll-arrow {
      display: none !important;
    }

    /* 5 Cards across on Desktop */
    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(5, 1fr) !important;
      gap: 10px !important;
      width: 100% !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      padding: 10px 8px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 105px !important;
      object-fit: contain;
    }
  }

  /* =========================================
     2. MOBILE: ZERO HORIZONTAL OVERFLOW
     ========================================= */
  @media (max-width: 991px) {
    /* Prevent the page from blowing out wider than the phone screen */
    .dashboard-layout {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    aside.sidebar-menu,
    .sidebar-menu {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 0 12px 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    .collections-title {
      display: block !important;
      width: 100% !important;
      font-size: 0.82rem !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase;
      color: var(--gold-accent, #c5a059) !important;
      margin: 0 0 8px 0 !important;
      padding-bottom: 4px !important;
      border-bottom: 1.5px solid var(--gold-border, rgba(197, 160, 89, 0.3)) !important;
    }

    /* Track Wrapper spans 100% phone width */
    .collections-wrapper {
      position: relative !important;
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    /* Swiping Track */
    .collections-pills-track {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
      box-sizing: border-box !important;
      gap: 8px !important;
      padding: 4px 44px 10px 0 !important; /* Clearance on right for the arrow */
      margin: 0 !important;
    }

    .collections-pills-track::-webkit-scrollbar {
      display: none !important;
    }

    /* Fat Bubbly Capsule Buttons */
    .collections-pills-track .tab-btn {
      flex: 0 0 auto !important;
      width: auto !important;
      white-space: nowrap !important;
      padding: 10px 14px !important;
      font-size: 0.82rem !important;
      font-weight: 800 !important;
      border-radius: 9999px !important;
      line-height: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25) !important;
    }

    .collections-pills-track .tab-btn i,
    .collections-pills-track .tab-btn svg {
      display: none !important;
    }

    /* Arrow pinned strictly to the true right edge */
    .mobile-scroll-arrow {
      position: absolute !important;
      right: 0 !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      width: 32px !important;
      height: 32px !important;
      border-radius: 50% !important;
      background: var(--gold-accent, #c5a059) !important;
      color: #121a12 !important;
      border: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: -3px 0 8px rgba(0, 0, 0, 0.4) !important;
      cursor: pointer !important;
      z-index: 30 !important;
      font-size: 0.82rem !important;
      padding: 0 !important;
    }

    .sidebar-promo {
      display: none !important;
    }

    /* 2 Jars per row: minmax(0, 1fr) prevents cards from blowing out screen width */
    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
      padding: 10px 6px !important;
      border-radius: 14px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 95px !important;
      object-fit: contain;
    }

    /* Ensure purchase buttons fit inside the 2-column mobile card */
    .product-card .btn-add,
    .product-card button {
      font-size: 0.72rem !important;
      padding: 0 !important;
    }

    /* Shrinks the title so 2. BIENESTAR stays inside the borders */
    .product-card h3,
    .product-card h4,
    .product-card .product-title {
      font-size: 0.75rem !important;
      letter-spacing: 0px !important;
      white-space: normal !important;
    }
  }
</style>

<div class="dashboard-layout">

    <h3 class="collections-title">Colecciones</h3>
    
    <div class="collections-wrapper">
      <div class="collections-pills-track" id="pillsTrack">
        <button class="tab-btn active" onclick="switchPage('productos'); setTimeout(() => selectCollection('BIENESTAR'), 100);">
          <span>Bienestar</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('CHAI LOVER'), 100);">
          <span>Chai Lover</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('BLUE MAGIC'), 100);">
          <span>Blue Magic</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('VIAJES CON TÉ'), 100);">
          <span>Viajes con Té</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('NOCTURNA'), 100);">
          <span>Nocturna</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('ESPECIAL'), 100);">
          <span>Especial</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('WOW'), 100);">
          <span>Wow</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('QUIERO MATCHA'), 100);">
          <span>Quiero Matcha</span>
        </button>
      </div>

      <!-- Functional Tap-to-Scroll Arrow -->
      <button type="button" class="mobile-scroll-arrow" aria-label="Ver más colecciones" onclick="document.getElementById('pillsTrack').scrollBy({left: 160, behavior: 'smooth'})">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </aside>

  <!-- 90% DESKTOP / 100% MOBILE GRID -->
  <main class="dashboard-content">
    <div class="collection-banner">
      <h2 id="current-collection-title" class="collection-name-title" style="margin-top: 0; text-align: left; color: var(--matcha-deep); font-size: 2em; border-bottom: 2px solid var(--gold-accent); padding-bottom: 10px; margin-bottom: 20px;">BIENESTAR</h2>
    </div>
    
    <div id="products-container" class="products-grid">
      <!-- Dynamic Products Injected via JS -->
    </div>
  </main>
</div>

<script>
  if (typeof selectCollection === 'function') {
    selectCollection('BIENESTAR');
  }
</script>
