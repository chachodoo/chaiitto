<style>
/* =======================================================
   1. DESKTOP (992px and up): 100% FULL-WIDTH & 6-COLUMN GRID
   ======================================================= */
@media (min-width: 992px) {
    /* Converts to full-width stack & removes the top gap so pills dock flush */
    .dashboard-layout {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        margin: -20px 0 0 0 !important;
    }

    /* Pinned collection bar locked flush against the bottom of the header */
    .dashboard-layout .sidebar-menu {
        width: 100% !important;
        position: sticky !important;
        top: 279px !important;
        z-index: 999 !important;
        background: var(--matcha-bg) !important;
        padding: 10px 0 12px 0 !important;
        margin: 0 0 16px 0 !important;
        flex: none !important;
        max-height: unset !important;
        overflow: visible !important;
    }

    /* Hide vertical sidebar title and desktop scroll arrow */
    .dashboard-layout .collections-title,
    .dashboard-layout .mobile-scroll-arrow {
        display: none !important;
    }

    /* Horizontal collection track */
    .dashboard-layout .collections-wrapper,
    .dashboard-layout .collections-pills-track {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 10px !important;
        width: 100% !important;
        flex-wrap: wrap !important;
        padding: 0 !important;
        overflow: visible !important;
    }

    /* UNIFIED COLOR RULE: Green pill with gold border matching the header */
    .dashboard-layout .tab-btn,
    .dashboard-layout .collections-pills-track .tab-btn {
        background: #07511A !important;
        color: #FFFFFF !important;
        border: 1.5px solid rgba(212, 175, 55, 0.45) !important;
        border-radius: 25px !important;
        padding: 8px 18px !important;
        font-size: 0.82rem !important;
        font-weight: 700 !important;
        white-space: nowrap !important;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15) !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
    }

    .dashboard-layout .tab-btn:hover {
        background: #18441F !important;
        border-color: #F5D061 !important;
        color: #FFFFFF !important;
        transform: translateY(-1px) !important;
    }

    /* ACTIVE STATE: Solid gold fill with dark green text matching TIENDA */
    .dashboard-layout .tab-btn.active,
    .dashboard-layout .tab-btn.active:hover {
        background: var(--gold-border) !important;
        color: #07511A !important;
        border-color: var(--gold-border) !important;
        font-weight: 800 !important;
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4) !important;
        transform: none !important;
    }

    /* 6 Cards across on Desktop */
    .dashboard-layout .dashboard-content {
        width: 100% !important;
        margin: 0 !important;
    }

    #products-container,
    .products-grid {
        display: grid !important;
        grid-template-columns: repeat(6, 1fr) !important;
        gap: 12px !important;
        width: 100% !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
        padding: 10px 8px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
    }

    #products-container .product-img-box,
    .products-grid .product-img-box {
        height: 110px !important;
        width: 100% !important;
        margin-bottom: 8px !important;
    }

    #products-container .product-img-box img,
    .products-grid .product-img-box img {
        max-height: 95px !important;
        max-width: 90% !important;
        object-fit: contain !important;
    }
}

  /* =========================================
     2. MOBILE: ZERO HORIZONTAL OVERFLOW
     ========================================= */
  @media (max-width: 991px) {
    /* Prevent the page from blowing out wider than the phone screen */
    .dashboard-layout {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    aside.sidebar-menu,
    .sidebar-menu {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 0 12px 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    
    .sidebar-promo {
      display: none !important;
    }

    /* 2 Jars per row: minmax(0, 1fr) prevents cards from blowing out screen width */
    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
      padding: 10px 6px !important;
      border-radius: 14px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 95px !important;
      object-fit: contain;
    }

    /* Ensure purchase buttons fit inside the 2-column mobile card */
    .product-card .btn-add,
    .product-card button {
      font-size: 0.72rem !important;
      padding: 0 !important;
    }

    /* Shrinks the title so 2. BIENESTAR stays inside the borders */
    .product-card h3,
    .product-card h4,
    .product-card .product-title {
      font-size: 0.75rem !important;
      letter-spacing: 0px !important;
      white-space: normal !important;
    }
  }
</style>

<div class="dashboard-layout">
  <!-- SIDEBAR (Desktop 10% / Mobile Full-Bleed Track) -->
  <aside class="sidebar-menu">
    <h3 class="collections-title">Colecciones</h3>
    
    <div class="collections-wrapper">
      <div class="collections-pills-track" id="pillsTrack" onscroll="const arrow = document.getElementById('collectionsScrollArrow'); if (arrow) { const atEnd = this.scrollLeft + this.clientWidth >= this.scrollWidth - 10; arrow.style.opacity = atEnd ? '0' : '1'; arrow.style.pointerEvents = atEnd ? 'none' : 'auto'; }">
        <button class="tab-btn active" onclick="switchPage('productos'); setTimeout(() => selectCollection('BIENESTAR'), 100);">
          <span>Bienestar</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('CHAI LOVER'), 100);">
          <span>Chai Lover</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('BLUE MAGIC'), 100);">
          <span>Blue Magic</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('VIAJES CON TÉ'), 100);">
          <span>Viajes con Té</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('NOCTURNA'), 100);">
          <span>Nocturna</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('ESPECIAL'), 100);">
          <span>Especial</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('WOW'), 100);">
          <span>Wow</span>
        </button>
      </div>
      <!-- Functional Tap-to-Scroll Arrow -->
      <button type="button" id="collectionsScrollArrow" class="mobile-scroll-arrow" style="transition: opacity 0.25s ease;" aria-label="Ver más colecciones" onclick="document.getElementById('pillsTrack').scrollBy({left: 160, behavior: 'smooth'})">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </aside>

  <!-- 90% DESKTOP / 100% MOBILE GRID -->
  <main class="dashboard-content">
    
    <div id="products-container" class="products-grid">
      <!-- Dynamic Products Injected via JS -->
    </div>
  </main>
</div>

<script>
  if (typeof selectCollection === 'function') {
    selectCollection('BIENESTAR');
  }
</script>
