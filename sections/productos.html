<style>
  /* =========================================
     1. DESKTOP: 10% SIDEBAR / 90% PRODUCT GRID
     ========================================= */
  @media (min-width: 993px) {
    .dashboard-layout {
      display: grid !important;
      grid-template-columns: 10% 90% !important;
      column-gap: 14px !important;
      align-items: start !important;
      width: 100% !important;
    }

    .sidebar-menu {
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .collections-title {
      color: var(--matcha-deep, #2d5a27);
      font-size: 0.8rem !important;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 10px 0;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--gold-accent, #c5a059);
    }

    .collections-pills-track {
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
      width: 100% !important;
    }

    .collections-pills-track .tab-btn {
      width: 100% !important;
      padding: 8px 4px !important;
      font-size: 0.76rem !important;
      font-weight: 700 !important;
      line-height: 1.2 !important;
      white-space: normal !important;
      text-align: center !important;
      justify-content: center !important;
    }

    .collections-pills-track .tab-btn i.fa-chevron-right {
      display: none !important;
    }

    .mobile-scroll-arrow {
      display: none !important;
    }

    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 14px !important;
      width: 100% !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      padding: 12px 10px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 120px !important;
      object-fit: contain;
    }
  }

  /* =========================================
     2. MOBILE: BUBBLY PILLS + REAL SCROLL ARROW
     ========================================= */
  @media (max-width: 992px) {
    .dashboard-layout {
      display: block !important;
      width: 100% !important;
    }

    aside.sidebar-menu,
    .sidebar-menu {
      display: block !important;
      width: 100% !important;
      margin: 0 0 12px 0 !important;
      padding: 0 !important;
    }

    .collections-title {
      display: block !important;
      font-size: 0.82rem !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase;
      color: var(--gold-accent, #c5a059) !important;
      margin: 0 0 8px 0 !important;
      padding-bottom: 4px !important;
      border-bottom: 1.5px solid var(--gold-border, rgba(197, 160, 89, 0.3)) !important;
    }

    .collections-wrapper {
      position: relative !important;
      width: 100% !important;
      display: flex !important;
      align-items: center !important;
    }

    .collections-pills-track {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
      width: 100% !important;
      gap: 8px !important;
      padding: 6px 42px 12px 4px !important; /* Space on right so arrow doesn't cover last pill */
      margin: 0 !important;
    }

    .collections-pills-track::-webkit-scrollbar {
      display: none !important;
    }

    /* Fat & Bubbly Capsules */
    .collections-pills-track .tab-btn {
      flex: 0 0 auto !important;
      width: auto !important;
      white-space: nowrap !important;
      padding: 12px 16px !important;
      font-size: 0.84rem !important;
      font-weight: 800 !important;
      border-radius: 9999px !important;
      line-height: 1 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2) !important;
    }

    .collections-pills-track .tab-btn i,
    .collections-pills-track .tab-btn svg {
      display: none !important;
    }

    /* Floating Tap-to-Scroll Arrow */
    .mobile-scroll-arrow {
      position: absolute !important;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold-accent, #c5a059);
      color: #121a12;
      border: none;
      display: flex !important;
      align-items: center;
      justify-content: center;
      box-shadow: -3px 0 8px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 10;
      font-size: 0.85rem;
    }

    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px !important;
      width: 100% !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      padding: 10px 8px !important;
      border-radius: 14px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 100px !important;
      object-fit: contain;
    }
  }
</style>

<div class="dashboard-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar-menu">
    <h3 class="collections-title">Colecciones</h3>
    
    <div class="collections-wrapper">
      <div class="collections-pills-track" id="pillsTrack">
        <button class="tab-btn active" onclick="switchPage('productos'); setTimeout(() => selectCollection('BIENESTAR'), 100);">
          <span>Bienestar</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('CHAI LOVER'), 100);">
          <span>Chai Lover</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('BLUE MAGIC'), 100);">
          <span>Blue Magic</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('VIAJES CON TÉ'), 100);">
          <span>Viajes con Té</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('NOCTURNA'), 100);">
          <span>Nocturna</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('ESPECIAL'), 100);">
          <span>Especial</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('WOW'), 100);">
          <span>Wow</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('QUIERO MATCHA'), 100);">
          <span>Quiero Matcha</span>
        </button>
      </div>

      <!-- Functional mobile scroll button -->
      <button class="mobile-scroll-arrow" aria-label="Ver más colecciones" onclick="document.getElementById('pillsTrack').scrollBy({left: 140, behavior: 'smooth'})">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </aside>

  <!-- 90% PRODUCT GRID -->
  <main class="dashboard-content">
    <div class="collection-banner">
      <h2 id="current-collection-title" class="collection-name-title" style="margin-top: 0; text-align: left; color: var(--matcha-deep); font-size: 2em; border-bottom: 2px solid var(--gold-accent); padding-bottom: 10px; margin-bottom: 20px;">BIENESTAR</h2>
    </div>
    
    <div id="products-container" class="products-grid">
      <!-- Injected via JavaScript -->
    </div>
  </main>
</div>

<script>
  if (typeof selectCollection === 'function') {
    selectCollection('BIENESTAR');
  }
</script>
