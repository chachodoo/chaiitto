<style>
  /* =========================================
     1. DESKTOP (992px and up): 10% / 90% (5 JARS)
     ========================================= */
  @media (min-width: 992px) {
    .dashboard-layout {
      display: grid !important;
      grid-template-columns: 10% 90% !important;
      column-gap: 14px !important;
      align-items: start !important;
      width: 100% !important;
      margin: 0 !important;
    }

    .sidebar-menu {
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      flex: none !important;
    }

    /* 5 Cards across on Desktop */
    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(5, 1fr) !important;
      gap: 10px !important;
      width: 100% !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      padding: 10px 8px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 105px !important;
      object-fit: contain;
    }
  }

  /* =========================================
     2. MOBILE: ZERO HORIZONTAL OVERFLOW
     ========================================= */
  @media (max-width: 991px) {
    /* Prevent the page from blowing out wider than the phone screen */
    .dashboard-layout {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    aside.sidebar-menu,
    .sidebar-menu {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 0 12px 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    
    .sidebar-promo {
      display: none !important;
    }

    /* 2 Jars per row: minmax(0, 1fr) prevents cards from blowing out screen width */
    #products-container,
    .products-grid {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }

    #products-container .product-card,
    .products-grid .product-card {
      width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
      padding: 10px 6px !important;
      border-radius: 14px !important;
    }

    #products-container .product-img-box,
    #products-container img,
    .products-grid .product-img-box,
    .products-grid img {
      max-height: 95px !important;
      object-fit: contain;
    }

    /* Ensure purchase buttons fit inside the 2-column mobile card */
    .product-card .btn-add,
    .product-card button {
      font-size: 0.72rem !important;
      padding: 0 !important;
    }

    /* Shrinks the title so 2. BIENESTAR stays inside the borders */
    .product-card h3,
    .product-card h4,
    .product-card .product-title {
      font-size: 0.75rem !important;
      letter-spacing: 0px !important;
      white-space: normal !important;
    }
  }
</style>

<div class="dashboard-layout">
  <!-- SIDEBAR (Desktop 10% / Mobile Full-Bleed Track) -->
  <aside class="sidebar-menu">
    <h3 class="collections-title">Colecciones</h3>
    
    <div class="collections-wrapper">
      <div class="collections-pills-track" id="pillsTrack" onscroll="const arrow = document.getElementById('collectionsScrollArrow'); if (arrow) { const atEnd = this.scrollLeft + this.clientWidth >= this.scrollWidth - 10; arrow.style.opacity = atEnd ? '0' : '1'; arrow.style.pointerEvents = atEnd ? 'none' : 'auto'; }">
        <button class="tab-btn active" onclick="switchPage('productos'); setTimeout(() => selectCollection('BIENESTAR'), 100);">
          <span>Bienestar</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('CHAI LOVER'), 100);">
          <span>Chai Lover</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('BLUE MAGIC'), 100);">
          <span>Blue Magic</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('VIAJES CON TÉ'), 100);">
          <span>Viajes con Té</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('NOCTURNA'), 100);">
          <span>Nocturna</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('ESPECIAL'), 100);">
          <span>Especial</span>
        </button>
        <button class="tab-btn" onclick="switchPage('productos'); setTimeout(() => selectCollection('WOW'), 100);">
          <span>Wow</span>
        </button>
      </div>
      <!-- Functional Tap-to-Scroll Arrow -->
      <button type="button" id="collectionsScrollArrow" class="mobile-scroll-arrow" style="transition: opacity 0.25s ease;" aria-label="Ver más colecciones" onclick="document.getElementById('pillsTrack').scrollBy({left: 160, behavior: 'smooth'})">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </aside>

  <!-- 90% DESKTOP / 100% MOBILE GRID -->
  <main class="dashboard-content">
    <div class="collection-banner">
      <h2 id="current-collection-title" class="collection-name-title" style="margin-top: 0; text-align: left; color: var(--matcha-deep); font-size: 2em; border-bottom: 2px solid var(--gold-accent); padding-bottom: 10px; margin-bottom: 20px;">BIENESTAR</h2>
    </div>
    
    <div id="products-container" class="products-grid">
      <!-- Dynamic Products Injected via JS -->
    </div>
  </main>
</div>

<script>
  if (typeof selectCollection === 'function') {
    selectCollection('BIENESTAR');
  }
</script>
