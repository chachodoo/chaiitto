<style>
    /* ==========================================
       FULL-WIDTH CATALOG GRID (NO SIDEBAR)
       ========================================== */
    #regalos-dynamic-track {
        display: grid !important;
        grid-template-columns: repeat(6, 1fr) !important; /* 6 per row on desktop */
        gap: 14px !important;
        width: 100% !important;
        margin-top: 20px;
    }

    /* Intermediate screen scaling */
    @media (max-width: 1280px) {
        #regalos-dynamic-track {
            grid-template-columns: repeat(4, 1fr) !important; /* 4 per row on small laptops */
        }
    }

    @media (max-width: 900px) {
        #regalos-dynamic-track {
            grid-template-columns: repeat(3, 1fr) !important; /* 3 per row on tablets */
        }
    }

    /* Mobile: 2 per row */
    /* Mobile & Tablets (under 992px): 2 per row - STRICT ZERO-BLOWOUT */
    @media (max-width: 991px) {
        #regalos-dynamic-track {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 8px !important;
        }
        #regalos-dynamic-track .product-card {
            padding: 10px 8px !important;
            overflow: hidden !important;
        }
        #regalos-dynamic-track .product-name {
            font-size: 0.88rem !important;
        }
    }

    /* ==========================================
       OFERTA BADGE & PRICING STYLES
       ========================================== */
    .badge-oferta {
        position: absolute;
        top: 8px;
        right: 8px;
        background: linear-gradient(135deg, #FF1E27 0%, #D60000 100%);
        color: #FFFFFF;
        font-size: 0.65rem;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 10px;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        z-index: 2;
    }

    .precio-box {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 6px 0;
    }

    .precio-original {
        text-decoration: line-through;
        color: #888888;
        font-size: 0.82rem;
    }

    .precio-actual {
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--matcha-deep, #2D5A27);
    }
</style>

<div class="story-card">
    <!-- RESPONSIVE REGALOS GRID CONTAINER -->
    <div class="catalog-grid" id="regalos-dynamic-track">
        <!-- Dynamic cards injected from regalos.json -->
    </div>
</div>

<!-- LIGHTBOX ZOOM MODAL -->
<div class="oferta-modal" id="oferta-modal" onclick="closeOfertaModalOnBackdrop(event)">
  <div class="oferta-modal-content">
    <span class="oferta-modal-close" onclick="closeOfertaModal()">&times;</span>
    <h2 id="modal-title" class="oferta-title"></h2>
    <p id="modal-subtitle" class="oferta-subtitle"></p>
    <div class="oferta-modal-viewer">
      <button class="modal-arrow prev" id="modal-prev-btn" onclick="changeModalImage(-1)">&#10094;</button>
      <img id="modal-img" src="" alt="Zoom">
      <button class="modal-arrow next" id="modal-next-btn" onclick="changeModalImage(1)">&#10095;</button>
    </div>
    <div id="modal-counter"></div>
  </div>
</div>
