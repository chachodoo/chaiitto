<!DOCTYPE html>
<html lang="es"> <!-- Idioma configurado a español -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai-itto - Salud con Té</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* Fuente más moderna */
            background-color: #f0f7f0; /* Un verde pálido de fondo */
            color: #1e3924; /* Un verde oscuro profundo para el texto */
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); /* Sombra suave */
            border: 2px solid #e2b31e; /* Borde amarillo dorado como el logo */
        }
        .logo {
            max-width: 200px; /* Tamaño del logo */
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #1e3924;
            font-size: 2.2em;
            margin-top: 0;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
        .slogan {
            color: #e2b31e; /* El amarillo dorado para el slogan */
            font-weight: bold;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Esta línea inserta tu logo -->
        <img src="chaiittologo.png" alt="Logo Chai-itto" class="logo">
        
        <h1>Bienvenido a Chai-itto</h1>
        <p class="slogan">Salud con Té</p>
        <p>Muy pronto: las mejores infusiones artesanales.</p>
    </div>
</body>
</html>
