<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chai-itto | Conversor WebP de Alta Resolución</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #07150C;
      color: #E2ECE5;
      padding: 30px 20px;
      max-width: 680px;
      margin: 0 auto;
    }
    h1 { color: #E5C158; font-size: 1.5rem; margin-bottom: 6px; }
    p { color: #A3B899; font-size: 0.88rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.82rem; color: #E5C158; }
    input {
      padding: 10px 14px;
      font-size: 0.92rem;
      border-radius: 8px;
      border: 1px solid rgba(229, 193, 88, 0.4);
      background: #0D2616;
      color: #FFFFFF;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: #E5C158; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      background: #25D366;
      color: #07150C;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    button:hover { background: #1EBE5D; }
    .divider {
      text-align: center;
      margin: 20px 0;
      border-top: 1px solid rgba(229, 193, 88, 0.25);
      position: relative;
    }
    .divider span {
      position: relative;
      top: -10px;
      background: #07150C;
      padding: 0 10px;
      font-size: 0.78rem;
      color: #A3B899;
    }
    #log {
      background: #040A06;
      border: 1px solid rgba(229, 193, 88, 0.2);
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.82rem;
      height: 240px;
      overflow-y: auto;
      color: #00FF66;
      margin-top: 18px;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <h1>Conversor WebP de Alta Resolución</h1>
  <p>Convierte páginas individuales del menú o imágenes de productos superando el límite de 1MB de GitHub.</p>

  <div class="form-group">
    <label>GitHub Personal Access Token:</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Carpeta en Repo:</label>
      <input type="text" id="target-folder" value="menu" placeholder="menu">
    </div>
    <div class="form-group">
      <label>Archivo Origen:</label>
      <input type="text" id="source-file" value="page-9.png" placeholder="page-9.png">
    </div>
  </div>

  <div class="form-group">
    <label>Nombre WebP Destino (opcional):</label>
    <input type="text" id="output-file" value="page-9.webp" placeholder="page-9.webp">
  </div>

  <button onclick="convertRepoFile()">1. Convertir desde Repositorio de GitHub</button>

  <div class="divider"><span>O CONVIERTE DESDE TU COMPUTADORA</span></div>

  <div class="form-group">
    <label>Seleccionar archivo de tu equipo (.png o .jpg):</label>
    <input type="file" id="local-file-input" accept="image/png, image/jpeg">
  </div>
  <button onclick="convertLocalFile()" style="background: #E5C158;">2. Procesar Archivo Local y Descargar WebP</button>

  <div id="log">Listo para procesar...<br></div>

  <script>
    const REPO_OWNER = "chachodoo";
    const REPO_NAME = "chaiitto";

    function log(msg) {
      const el = document.getElementById('log');
      el.innerHTML += msg + "<br>";
      el.scrollTop = el.scrollHeight;
    }

    function processImageToWebp(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1400;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const webpDataUrl = canvas.toDataURL('image/webp', 0.82);
          resolve(webpDataUrl.split(',')[1]);
        };
        img.onerror = () => reject(new Error("No se pudo decodificar la imagen PNG."));
        img.src = dataUrl;
      });
    }

    async function convertRepoFile() {
      const token = document.getElementById('gh-token').value.trim();
      let folder = document.getElementById('target-folder').value.trim().replace(/^\/+|\/+$/g, '');
      const sourceFile = document.getElementById('source-file').value.trim();
      let outputFile = document.getElementById('output-file').value.trim();

      if (!token) return alert('Por favor ingresa tu GitHub Personal Access Token.');
      if (!sourceFile) return alert('Por favor ingresa el nombre del archivo origen.');

      if (!outputFile) {
        const dotIndex = sourceFile.lastIndexOf('.');
        outputFile = (dotIndex !== -1 ? sourceFile.substring(0, dotIndex) : sourceFile) + '.webp';
      }

      const srcPath = folder ? `${folder}/${sourceFile}` : sourceFile;
      const dstPath = folder ? `${folder}/${outputFile}` : outputFile;

      const headers = {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      log(`\n========================================`);
      log(`Buscando: ${srcPath}...`);

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${srcPath}`, { headers });
        if (!getRes.ok) {
          throw new Error(`GitHub respondió con error ${getRes.status}. Verifica que el archivo exista y que tu token tenga permisos.`);
        }

        const srcData = await getRes.json();
        let rawBase64 = srcData.content ? srcData.content.replace(/\s/g, '') : null;

        // Bypasses 1MB API limit using Git Blobs endpoint
        if (!rawBase64 && srcData.sha) {
          const mbSize = (srcData.size / (1024 * 1024)).toFixed(2);
          log(`  ℹ️ Archivo grande detectado (${mbSize} MB). Descargando blob Git completo...`);
          const blobRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/blobs/${srcData.sha}`, { headers });
          if (!blobRes.ok) throw new Error(`Error ${blobRes.status} al descargar el blob de GitHub.`);
          const blobData = await blobRes.json();
          rawBase64 = blobData.content.replace(/\s/g, '');
        }

        if (!rawBase64) throw new Error("No se pudo obtener el contenido del archivo.");

        const ext = sourceFile.split('.').pop().toLowerCase();
        const mime = ext === 'png' ? 'image/png' : 'image/jpeg';
        const dataUrl = `data:${mime};base64,${rawBase64}`;

        log(`  Comprimiendo a WebP...`);
        const webpBase64 = await processImageToWebp(dataUrl);

        // Fetch SHA of existing target file to allow overwriting
        let fileSha = '';
        try {
          const checkRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${dstPath}`, { headers });
          if (checkRes.ok) {
            const checkData = await checkRes.json();
            fileSha = checkData.sha;
            log(`  ℹ️ ${dstPath} ya existe. Reemplazando versión previa.`);
          }
        } catch(e) {}

        log(`  Subiendo ${dstPath} a GitHub...`);
        const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${dstPath}`, {
          method: 'PUT',
          headers,
          body: JSON.stringify({
            message: `Convert ${srcPath} to WebP: ${dstPath}`,
            content: webpBase64,
            sha: fileSha || undefined
          })
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(`Error en GitHub al guardar: ${errData.message}`);
        }

        log(`✅ ¡Éxito! ${dstPath} guardado en tu repositorio.`);
        log(`========================================`);
      } catch (err) {
        log(`❌ Error: ${err.message}`);
      }
    }

    async function convertLocalFile() {
      const input = document.getElementById('local-file-input');
      if (!input.files || input.files.length === 0) {
        return alert('Selecciona un archivo PNG o JPG de tu computadora primero.');
      }
      const file = input.files[0];
      log(`\nProcesando archivo local: ${file.name} (${(file.size / 1024).toFixed(1)} KB)...`);

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const webpBase64 = await processImageToWebp(e.target.result);
          const link = document.createElement('a');
          const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          link.download = `${baseName}.webp`;
          link.href = `data:image/webp;base64,${webpBase64}`;
          link.click();
          log(`✅ Archivo convertido y descargado como: ${link.download}`);
        } catch(err) {
          log(`❌ Error: ${err.message}`);
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
